sylius_twig_hooks:
    hooks:
        # Sylius renders per-factory gateway configuration only through the
        # `gateway_configuration.<factory>` hook - without these hooks the
        # EveryPay credential fields silently do not appear on the payment
        # method form (the form type + attribute alone are not enough).
        'sylius_admin.payment_method.create.content.form.sections.gateway_configuration.everypay': &everypay_gateway_config
            everypay:
                template: '@PkgSyliusEveryPayPlugin/admin/payment_method/form/sections/gateway_configuration/everypay.html.twig'
                priority: 0
        'sylius_admin.payment_method.update.content.form.sections.gateway_configuration.everypay': *everypay_gateway_config

        # An extra cell on each payment row of the admin order page: the raw
        # EveryPay state, the payment reference and (on live) a portal link.
        'sylius_admin.order.show.content.sections.payments.item':
            everypay:
                template: '@PkgSyliusEveryPayPlugin/admin/order/show/payments/item/everypay.html.twig'
                priority: 150

        # Charged-back payments surface in the navbar bell (the state mapping
        # deliberately keeps chargebacks transition-less). The stock
        # notifications template renders plain messages only, so the component
        # template is swapped for one that can also render a link per
        # notification - here, to the EveryPay merchant portal.
        'sylius_admin.common.component.navbar.items':
            notifications:
                component: 'sylius_admin:navbar:notifications'
                props:
                    template: '@PkgSyliusEveryPayPlugin/admin/shared/components/navbar/notifications.html.twig'
                priority: 100
